<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TGC Connect HRMS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-hero-glow {
            position: absolute;
            width: 520px;
            height: 520px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, rgba(14, 165, 233, 0.08) 50%, transparent 70%);
            filter: blur(45px);
            z-index: -1;
            pointer-events: none;
            animation: pulseGlow 8s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.9) translate(-10%, -10%); opacity: 0.6; }
            100% { transform: scale(1.1) translate(10%, 10%); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <canvas id="confettiCanvas"></canvas>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-badge">TGC</span>
                <span>Connect</span>
            </a>
            <div id="navUserArea" style="display: flex; gap: 0.75rem; align-items: center;">
                <a href="index.html" class="btn btn-secondary btn-sm">
                    <i data-lucide="home" style="width: 15px;"></i> Home
                </a>
                <a href="register.html" class="btn btn-primary btn-sm">
                    <i data-lucide="user-plus" style="width: 15px;"></i> Self-Register
                </a>
            </div>
        </div>
    </nav>

    <main class="main-container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 120px); position: relative;">
        <div class="login-hero-glow"></div>

        <div style="max-width: 480px; width: 100%; margin: 1.5rem 0;">
            <div class="card" style="padding: 2.5rem 2.25rem; box-shadow: var(--shadow-lg); border-radius: var(--radius-xl); border: 1px solid rgba(226, 232, 240, 0.9); background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px);">
                
                <!-- Brand Header -->
                <div style="text-align: center; margin-bottom: 1.5rem;">
                    <div id="portalBadge" class="brand-badge" style="display: inline-block; margin-bottom: 0.75rem; font-size: 0.75rem; letter-spacing: 0.8px; padding: 0.3rem 0.85rem;">
                        ADMINISTRATIVE ACCESS
                    </div>
                    <h1 id="portalTitle" style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.6px; margin: 0;">
                        Management Sign In
                    </h1>
                    <p id="portalSubtitle" style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.4rem; line-height: 1.5;">
                        Executive control center & workforce management.
                    </p>
                </div>

                <!-- Dedicated Role Switcher (Admin vs Employee) -->
                <div class="role-segmented-control" role="tablist">
                    <button type="button" id="roleAdminBtn" onclick="switchRole('admin')" class="role-segment-btn active admin-mode" role="tab" aria-selected="true">
                        <i data-lucide="shield" style="width: 18px;"></i>
                        <span>Admin Login</span>
                    </button>
                    <button type="button" id="roleEmployeeBtn" onclick="switchRole('employee')" class="role-segment-btn" role="tab" aria-selected="false">
                        <i data-lucide="user" style="width: 18px;"></i>
                        <span>Employee Login</span>
                    </button>
                </div>

                <!-- Status Alert Box (for Pending Approval or Rejected accounts) -->
                <div id="loginStatusAlert" style="display: none; padding: 1.15rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.92rem; line-height: 1.5;"></div>

                <!-- Login Form -->
                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label" id="emailLabel">Official Admin Email</label>
                        <div class="password-input-group">
                            <input type="email" id="loginEmail" class="form-control" placeholder="admin@tgcconnect.com" value="admin@tgcconnect.com" required autofocus autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.45rem;">
                            <label class="form-label" style="margin-bottom: 0;">Password</label>
                            <span id="roleNotice" style="font-size: 0.78rem; color: var(--primary); font-weight: 700;">256-Bit Encrypted</span>
                        </div>
                        <div class="password-input-group">
                            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" value="admin123" required autocomplete="current-password">
                            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)" title="Toggle password visibility">
                                <i data-lucide="eye" style="width: 18px;"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.9rem; font-size: 1.02rem; margin-top: 0.75rem; border-radius: var(--radius-md); font-weight: 800; letter-spacing: -0.2px;">
                        <i data-lucide="log-in" style="width: 18px;"></i>
                        <span id="loginBtnText">Sign In as Administrator</span>
                    </button>
                </form>

                <!-- Quick Access Credentials Drawer -->
                <div style="margin-top: 1.75rem; padding: 1.15rem; background: var(--bg-main); border: 1px dashed var(--border-color); border-radius: var(--radius-md);">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <span style="font-size: 0.76rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px;">
                            Quick Demo Credentials
                        </span>
                        <span style="font-size: 0.75rem; color: var(--primary); font-weight: 700;">Click to autofill</span>
                    </div>

                    <!-- Admin Chips -->
                    <div id="adminChips" style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button type="button" onclick="fillCreds('admin@tgcconnect.com', 'admin123', 'admin')" class="quick-cred-chip" style="width: 100%; justify-content: space-between;">
                            <span style="display: flex; align-items: center; gap: 0.5rem;">
                                <span>🛡️</span>
                                <span>Master Administrator</span>
                            </span>
                            <code style="font-size: 0.76rem; color: var(--text-muted);">admin123</code>
                        </button>
                    </div>

                    <!-- Employee Chips -->
                    <div id="employeeChips" style="display: none; flex-direction: column; gap: 0.5rem;">
                        <button type="button" onclick="fillCreds('rohan.verma@tgcconnect.com', 'employee123', 'employee')" class="quick-cred-chip" style="width: 100%; justify-content: space-between;">
                            <span style="display: flex; align-items: center; gap: 0.5rem;">
                                <span>💻</span>
                                <span>Rohan Verma (Engineering)</span>
                            </span>
                            <code style="font-size: 0.76rem; color: var(--text-muted);">employee123</code>
                        </button>
                        <button type="button" onclick="fillCreds('priya.sharma@tgcconnect.com', 'employee123', 'employee')" class="quick-cred-chip" style="width: 100%; justify-content: space-between;">
                            <span style="display: flex; align-items: center; gap: 0.5rem;">
                                <span>🎨</span>
                                <span>Priya Sharma (Product Design)</span>
                            </span>
                            <code style="font-size: 0.76rem; color: var(--text-muted);">employee123</code>
                        </button>
                    </div>
                </div>

                <!-- Footer Links -->
                <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.9rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 0.6rem;">
                    <div>
                        New team member? 
                        <a href="register.html" style="color: var(--primary); font-weight: 800; text-decoration: none;">
                            Submit onboarding application &rarr;
                        </a>
                    </div>
                    <div style="font-size: 0.8rem; color: var(--text-muted);">
                        Office QR Attendance station? <a href="qr_scanner.html" style="color: var(--text-main); font-weight: 700;">Open QR Terminal</a>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        let currentRole = 'admin';

        function switchRole(role) {
            playSound('click');
            currentRole = role;
            const adminBtn = document.getElementById('roleAdminBtn');
            const empBtn = document.getElementById('roleEmployeeBtn');
            const portalBadge = document.getElementById('portalBadge');
            const portalTitle = document.getElementById('portalTitle');
            const portalSubtitle = document.getElementById('portalSubtitle');
            const emailLabel = document.getElementById('emailLabel');
            const loginEmail = document.getElementById('loginEmail');
            const loginPassword = document.getElementById('loginPassword');
            const loginBtnText = document.getElementById('loginBtnText');
            const adminChips = document.getElementById('adminChips');
            const employeeChips = document.getElementById('employeeChips');
            const alertBox = document.getElementById('loginStatusAlert');
            alertBox.style.display = 'none';

            if (role === 'admin') {
                adminBtn.className = 'role-segment-btn active admin-mode';
                empBtn.className = 'role-segment-btn';
                adminBtn.setAttribute('aria-selected', 'true');
                empBtn.setAttribute('aria-selected', 'false');

                portalBadge.textContent = 'ADMINISTRATIVE ACCESS';
                portalBadge.style.background = 'linear-gradient(135deg, #4f46e5, #7c3aed)';
                portalTitle.textContent = 'Management Sign In';
                portalSubtitle.textContent = 'Executive command center & workforce management.';
                emailLabel.textContent = 'Official Admin Email';
                loginEmail.placeholder = 'admin@tgcconnect.com';
                loginEmail.value = 'admin@tgcconnect.com';
                loginPassword.value = 'admin123';
                loginBtnText.textContent = 'Sign In as Administrator';

                adminChips.style.display = 'flex';
                employeeChips.style.display = 'none';
            } else {
                empBtn.className = 'role-segment-btn active employee-mode';
                adminBtn.className = 'role-segment-btn';
                empBtn.setAttribute('aria-selected', 'true');
                adminBtn.setAttribute('aria-selected', 'false');

                portalBadge.textContent = 'EMPLOYEE SELF-SERVICE';
                portalBadge.style.background = 'linear-gradient(135deg, #059669, #0284c7)';
                portalTitle.textContent = 'Employee Sign In';
                portalSubtitle.textContent = 'Punch attendance, manage leaves, view payslips & profile.';
                emailLabel.textContent = 'Official Work Email';
                loginEmail.placeholder = 'name@tgcconnect.com';
                loginEmail.value = 'rohan.verma@tgcconnect.com';
                loginPassword.value = 'employee123';
                loginBtnText.textContent = 'Sign In to Employee Portal';

                adminChips.style.display = 'none';
                employeeChips.style.display = 'flex';
            }
            lucide.createIcons();
        }

        function fillCreds(email, pass, role) {
            playSound('click');
            if (role && role !== currentRole) {
                switchRole(role);
            }
            document.getElementById('loginEmail').value = email;
            document.getElementById('loginPassword').value = pass;
            showToast(`Filled credentials for ${email}`, 'info');
        }

        function togglePasswordVisibility(inputId, btn) {
            playSound('click');
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = '<i data-lucide="eye-off" style="width: 18px;"></i>';
            } else {
                input.type = 'password';
                btn.innerHTML = '<i data-lucide="eye" style="width: 18px;"></i>';
            }
            lucide.createIcons();
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            const alertBox = document.getElementById('loginStatusAlert');
            alertBox.style.display = 'none';

            btn.disabled = true;
            btn.innerHTML = '<i data-lucide="loader" class="spin" style="width: 18px;"></i> Authenticating...';
            lucide.createIcons();

            const payload = {
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPassword').value
            };

            const res = await apiRequest('auth.php?action=login', 'POST', payload);
            if (res.ok && res.data.success) {
                playSound('success');
                fireConfetti();
                showToast(`Welcome back, ${res.data.user.name}! Accessing workspace...`, 'success');

                setTimeout(() => {
                    window.location.href = res.data.redirect || (res.data.user.role === 'admin' ? 'admin.html' : 'portal.html');
                }, 600);
            } else {
                playSound('error');
                btn.disabled = false;
                btn.innerHTML = `<i data-lucide="log-in" style="width: 18px;"></i> <span>${currentRole === 'admin' ? 'Sign In as Administrator' : 'Sign In to Employee Portal'}</span>`;
                lucide.createIcons();

                if (res.data.account_status === 'pending_approval') {
                    alertBox.style.display = 'block';
                    alertBox.style.background = '#fffbeb';
                    alertBox.style.border = '1.5px solid #fde68a';
                    alertBox.style.color = '#92400e';
                    alertBox.innerHTML = `
                        <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
                            <span style="font-size: 1.4rem;">⏳</span>
                            <div>
                                <strong style="font-size: 0.95rem;">Onboarding Pending Administrative Review</strong>
                                <div style="margin-top: 0.35rem; font-size: 0.86rem; color: #78350f;">
                                    Your registration application and verified webcam photograph have been received and are queued in the Administrator's Approvals Hub.
                                </div>
                            </div>
                        </div>
                    `;
                } else if (res.data.account_status === 'rejected') {
                    alertBox.style.display = 'block';
                    alertBox.style.background = '#fef2f2';
                    alertBox.style.border = '1.5px solid #fecaca';
                    alertBox.style.color = '#991b1b';
                    alertBox.innerHTML = `
                        <div style="display: flex; gap: 0.75rem; align-items: flex-start;">
                            <span style="font-size: 1.4rem;">🚫</span>
                            <div>
                                <strong style="font-size: 0.95rem;">Application Declined</strong>
                                <div style="margin-top: 0.35rem; font-size: 0.86rem; color: #7f1d1d;">
                                    Your registration application was declined. Please contact your organization administrator or HR representative.
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    showToast(res.data.message || 'Invalid email or password', 'error');
                }
            }
        }

        // Check if role is pre-selected via query string (e.g. login.html?role=employee)
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const role = urlParams.get('role');
            if (role === 'employee') {
                switchRole('employee');
            }
        });
    </script>
</body>
</html>
