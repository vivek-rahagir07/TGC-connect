<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TGC Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-badge">TGC</span>
                <span>Connect</span>
            </a>
            <div id="navUserArea">
                <a href="register.html" class="btn btn-secondary btn-sm">Onboard Employee</a>
            </div>
        </div>
    </nav>

    <main class="main-container" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 150px);">
        <div style="max-width: 440px; width: 100%;">
            <div class="card" style="padding: 2.5rem; box-shadow: var(--shadow-lg);">
                
                <div style="text-align: center; margin-bottom: 2rem;">
                    <div class="brand-badge" style="display: inline-block; margin-bottom: 0.75rem;">TGC CONNECT</div>
                    <h1 style="font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px;">Welcome Back</h1>
                    <p style="color: var(--text-muted); font-size: 0.92rem; margin-top: 0.25rem;">
                        Sign in to access your portal, attendance logs, and payroll records.
                    </p>
                </div>

                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="name@tgcconnect.com" required autofocus autocomplete="email">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="loginSubmitBtn" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
                        Sign In to Workspace
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-muted);">
                    New staff member? <a href="register.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Self-register here</a>
                </div>

            </div>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="js/app.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            const payload = {
                email: document.getElementById('loginEmail').value.trim(),
                password: document.getElementById('loginPassword').value
            };

            const res = await apiRequest('auth.php?action=login', 'POST', payload);
            if (res.ok && res.data.success) {
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = res.data.redirect || 'portal.html';
                }, 400);
            } else {
                showToast(res.data.message || 'Invalid credentials', 'error');
                btn.disabled = false;
                btn.textContent = 'Sign In to Workspace';
            }
        }
    </script>
</body>
</html>
